{{- /* Fonts load without blocking first paint: the stylesheet starts as media=print
     and switches to all once loaded; system fonts show until then */}}
{{- $fonts := "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ $fonts }}" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="{{ $fonts }}"></noscript>
