baseURL: "https://lukelittle.com/"
title: "Luke Little"
languageCode: "en"
theme: "PaperMod"

# Pagination
pagination:
  pagerSize: 10

params:
  env: production
  description: "I build cloud and AI systems for banking and capital markets, and help engineers and students level up."
  author: "Luke Little"
  
  # Follow the visitor's OS preference; toggle in the header to override
  defaultTheme: "auto"
  disableThemeToggle: false

  # Intro block at the top of the homepage
  homeInfoParams:
    Title: "Hi, I'm Luke 👋"
    Content: >
      I build cloud and AI systems for banking and capital markets, and help engineers and students level up.
      I write about **[regulated systems on AWS](/series/regulated-markets-on-aws/)**, **[applied AI and agents](/tags/ai/)**,
      **[teaching the next generation of builders](/tags/education/)**, and the **[talks and podcasts](/talks/)** I get to be part of.
  
  # Social icons
  socialIcons:
    - name: "bluesky"
      url: "https://bsky.app/profile/lukelittle.com"
    - name: "github"
      url: "https://github.com/lukelittle"
    # TODO: add your LinkedIn URL and uncomment
    # - name: "linkedin"
    #   url: "https://www.linkedin.com/in/<handle>/"
    - name: "rss"
      url: "/index.xml"

  # Show post metadata
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowShareButtons: false

# Output formats
outputs:
  home:
    - HTML
    - RSS

# Taxonomies
taxonomies:
  tag: tags
  category: categories
  series: series

# Permalinks - date-based URLs with posts prefix for year/month archives
permalinks:
  posts: "/posts/:year/:month/:title/"

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai

# Menu
menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Series
      url: /series/
      weight: 20
    - name: Talks
      url: /talks/
      weight: 30
    - name: Projects
      url: /projects/
      weight: 40
    - name: Now
      url: /now/
      weight: 50
    - name: About
      url: /about/
      weight: 60
