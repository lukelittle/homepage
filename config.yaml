baseURL: "https://lukelittle.com/"
title: "Luke Little"
languageCode: "en"
theme: "PaperMod"
enableRobotsTXT: true

# Pagination
pagination:
  pagerSize: 10

params:
  env: production
  description: "I build cloud and AI systems for banking and capital markets, and help engineers and students level up."
  author: "Luke Little"
  
  # Follow the visitor's OS preference; toggle in the header to override
  defaultTheme: "auto"
  disableThemeToggle: false

  # Intro block at the top of the homepage
  homeInfoParams:
    Title: "Hi, I'm Luke 👋"
    Avatar: "/images/avatar.png"
    Content: >
      I'm Head of Intelligent Data and Cloud at Ippon Technologies. I build cloud and AI systems for banking and capital markets, and help engineers and students level up.
      I lead the Richmond AWS User Group and I'm working on my MBA at Duke. I write about **[regulated systems on AWS](/series/regulated-markets-on-aws/)**, **[applied AI and agents](/tags/ai/)**,
      **[teaching the next generation of builders](/tags/education/)**, and the **[talks and podcasts](/talks/)** I get to be part of.
  
  # Social icons
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/lucaslittle/"
    - name: "github"
      url: "https://github.com/lukelittle"
    - name: "rss"
      url: "/index.xml"

  # Link-preview image for pages without their own cover (homepage, About, Talks...)
  images:
    - "/images/og-default.png"

  # "Start here" picks on the homepage (content paths)
  homeFeatured:
    - posts/2026/02/sec-15c3-5-market-access-controls
    - posts/2026/02/prompt-to-production-safe-genai-aws
    - posts/2026/02/the-missing-layer-in-your-enterprise-ai-stack-aws-bedrock-guardrails
    - posts/2025/12/cracking-the-cloud

  # Browser/device icons (Safari's pinned-tab icon reuses the 32px favicon)
  assets:
    safari_pinned_tab: "/favicon-32x32.png"

  # Single-author site: no byline on every card
  hideAuthor: true

  # Covers show on post pages only, keeping the homepage list compact
  cover:
    hiddenInList: true

  # Table of contents on long posts (see layouts/_default/single.html)
  ShowToc: true
  TocOpen: false

  # Full post text in RSS, so feed readers don't have to click through
  ShowFullTextinRSS: true

  # Show post metadata
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowShareButtons: false

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON  # search index for /search/

# Taxonomies
taxonomies:
  tag: tags
  category: categories
  series: series

# Permalinks - date-based URLs with posts prefix for year/month archives
permalinks:
  posts: "/posts/:year/:month/:title/"

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai

# Menu
menu:
  main:
    - name: Posts
      url: /archives/
      weight: 10
    - name: Series
      url: /series/
      weight: 20
    - name: Talks
      url: /talks/
      weight: 30
    - name: Projects
      url: /projects/
      weight: 40
    - name: Now
      url: /now/
      weight: 50
    - name: About
      url: /about/
      weight: 60
    - name: Search
      url: /search/
      weight: 70
